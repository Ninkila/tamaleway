[/Script/EngineSettings.GameMapsSettings]
GameInstanceClass=/Script/Tamale3D.TamaleGameInstance
GlobalDefaultGameMode=/Script/Tamale3D.TamaleGameMode
; The engine's empty Entry map: the C++ city builder generates the greybox at Play, so the project
; is playable before any level is authored. Once you save your own level (see BUILD_AND_TEST.md),
; point both settings at it, e.g. /Game/Maps/L_Tamale_Changli_Milestone1.L_Tamale_Changli_Milestone1
EditorStartupMap=/Engine/Maps/Entry
GameDefaultMap=/Engine/Maps/Entry

[/Script/Engine.RendererSettings]
; Conservative defaults for the baseline laptop (i7 8th Gen, 16 GB, integrated/entry GPU).
; Expensive features are opt-in through the Epic scalability level (DefaultScalability.ini), not global.
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.AllowStaticLighting=False
; 0 = no dynamic GI (Lumen = 1). Reflections: 2 = screen space (Lumen = 1).
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=2
; Virtual shadow maps off by default; regular cascaded shadow maps are far cheaper on laptop GPUs.
r.Shadow.Virtual.Enable=0
r.Nanite=1
; 2 = TAA (cheaper than TSR = 4 on integrated graphics)
r.AntiAliasingMethod=2
r.TemporalAA.Upsampling=1
r.Streaming.PoolSize=1536
r.ViewDistanceScale=0.85

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
TargetedRHIs=PCD3D_SM6
TargetedRHIs=PCD3D_SM5

